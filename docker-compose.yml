services:
  # Development server with the source bind-mounted for hot reload.
  #   docker compose up
  #   docker compose run --rm app test        # unit + integration tests
  #   docker compose run --rm app build       # production build into ./dist
  #   docker compose run --rm app lint
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's.
      - node_modules:/app/node_modules
    environment:
      # File watching through bind mounts is unreliable on macOS/Windows.
      - CHOKIDAR_USEPOLLING=true

  # Browser tests in Microsoft's Playwright image (browsers preinstalled).
  #   docker compose run --rm e2e
  # In a profile so `docker compose up` only starts the dev server.
  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    environment:
      - CI=true
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test"]

volumes:
  node_modules:
  e2e_node_modules:
